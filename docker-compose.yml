services:
  db:
    image: postgres:16
    container_name: store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      # Host port 5433 (5432 is often taken by a local Postgres install).
      - "5433:5432"
    volumes:
      - store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mail catcher: SMTP on 1025, web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: store-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  store_pgdata:
